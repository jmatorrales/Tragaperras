<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tragachris</title>
  </head>
  <body>
    <div class="container">
      <div class="slot-machine-container">
        <h1 class="title">Tragachris</h1>
        <div class="slot-machine">
          <div class="reel" id="item1"><div class="strip"></div></div>
          <div class="reel" id="item2"><div class="strip"></div></div>
          <div class="reel" id="item3"><div class="strip"></div></div>
        </div>
        <button id="spin-button">Girar</button>
      </div>
      <div class="instructions">
        <p style="color: antiquewhite">
          ¡Bienvenido a Tragachris! Presiona el botón "Girar" para probar tu
          suerte y ver si puedes conseguir una combinación ganadora.
        </p>
        <div class="prize-container">
          <h3 id="prize"></h3>
          <div id="prize-info"></div>
          <h4 id="coins"></h4>
          <button id="topUp">Recargar monedas</button>
        </div>
      </div>
      
    </div>

    <script src="script.js"></script>
  </body>
</html>
